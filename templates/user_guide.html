<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="@@GUIDE_PREFIX@@.title">@@GUIDE_TITLE@@</title>
<meta name="description" data-i18n-content="@@GUIDE_PREFIX@@.description" content="@@GUIDE_DESCRIPTION@@">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;font-size:18px;line-height:1.7;background:#0d1d27;color:#edf4ed;--gallery-background:#0d1d27;--gallery-ink:#edf4ed;--gallery-border:#35515d;--gallery-heading:#e6bc73;--gallery-link:#f5d59b}*{box-sizing:border-box}body{margin:0}a{color:#f5d59b}a:hover,a:focus-visible{outline:2px solid #e6bc73;outline-offset:4px}header,main{max-width:1040px;margin:auto;padding:24px 32px}header{padding-bottom:8px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{font-size:1rem;font-weight:700;text-decoration:none}.gallery-language{margin:0!important}h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.15;color:#e6bc73;margin:30px 0 16px}h2{font-size:1.45rem;line-height:1.3;color:#e6bc73;margin:44px 0 16px;padding-top:22px;border-top:1px solid #35515d}p{margin:0 0 20px}li{margin:8px 0}figure{margin:24px auto 32px}figure a{display:block}figure img{display:block;width:100%;height:auto;border:1px solid #35515d;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:.94rem;text-align:left}th,td{padding:14px 16px;border:1px solid #35515d;vertical-align:top}th{background:#223f4c}.table-scroll{overflow-x:auto;margin:24px 0}main{padding-bottom:64px}.guide-content>p:last-child{font-size:.85rem;color:#c1d2d5;margin-top:32px}[hidden]{display:none!important}@media(max-width:600px){header,main{padding-left:18px;padding-right:18px}th,td{padding:10px}h2{margin-top:32px}}
@@LANGUAGE_CSS@@
</style>
</head>
<body>
<header>
<nav class="topbar" aria-label="Navigation">
<a class="brand" href="@@HOME_URL@@">ANNO - Organizer</a>
<a href="@@HOME_URL@@" data-i18n="guide.home">Zur Startseite</a>
<div class="gallery-language" role="group" aria-label="Sprache" data-i18n-aria-label="language.label">
<button type="button" data-gallery-language="de" aria-pressed="true" lang="de">DE</button>
<button type="button" data-gallery-language="en" aria-pressed="false" lang="en">EN</button>
</div>
</nav>
<h1 data-i18n="@@GUIDE_PREFIX@@.heading">@@GUIDE_HEADING@@</h1>
</header>
<main>
@@GUIDE_CONTENT@@
</main>
<script id="gallery-language-resources" type="application/json">@@LANGUAGE_RESOURCES@@</script>
<script id="gallery-i18n">@@LANGUAGE_RUNTIME@@</script>
<script>@@GUIDE_RUNTIME@@</script>
</body>
</html>
