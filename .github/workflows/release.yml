name: Release ZIP
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a ZIP test build (does not publish a release)'
        required: true
        default: 'v0.1.5'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  package:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build ZIP and checksum from the tested commit
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: python scripts/build_release.py --version "$RELEASE_VERSION" --output dist
      - name: Prepare release description from the changelog
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: python scripts/release_notes.py --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: dist/*
          if-no-files-found: error
      - name: Publish tagged release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_VERSION" dist/* --verify-tag --draft --title "AnnoTools $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_VERSION" --draft=false
